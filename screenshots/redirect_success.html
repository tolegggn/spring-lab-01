<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Catalogue</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <h1>Catalogue</h1>

    <div style="margin-bottom: 1rem;">
        <a href="/books/new" class="button-link" style="display: inline-block; padding: 8px 16px; background-color: #22c55e; color: white; text-decoration: none; border-radius: 4px; font-weight: 500;">+ New Book (Form)</a>
    </div>

    <p class="flash">Book «Clean Architecture» has been added</p>

    <!-- Filter Form -->
    <form method="get" action="/books" class="filter-form">
        <label for="author">Filter by author:</label>
        <input type="text" id="author" name="author" value="" placeholder="e.g. Bloch">
        <button type="submit">Filter</button>
        
    </form>

    <table>
        <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th></tr>
        <tr>
            <td>1</td>
            <td>Effective Java</td>
            <td>Joshua Bloch</td>
            <td>2018</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Clean Code</td>
            <td>Robert Martin</td>
            <td>2008</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Spring in Action</td>
            <td>Craig Walls</td>
            <td>2022</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Clean Architecture</td>
            <td>Robert Martin</td>
            <td>2020</td>
        </tr>
    </table>

    <h2>Add a New Book</h2>
    <form method="post" action="/books" class="add-form">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div>
            <label for="author-input">Author:</label>
            <input type="text" id="author-input" name="author" required>
        </div>
        <div>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required>
        </div>
        <button type="submit">Add Book</button>
    </form>
</body>
</html>
