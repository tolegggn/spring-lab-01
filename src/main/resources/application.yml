server:
  port: 8080

app:
  owner: Tolegen Alikhan
  date-pattern: yyyy-MM-dd HH:mm:ss

logging:
  level:
    web: INFO

spring:
  application:
    name: spring-lab-01
  profiles:
    default: dev
  messages:
    basename: messages
    encoding: UTF-8
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/springlab
    username: springlab
    password: springlab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
