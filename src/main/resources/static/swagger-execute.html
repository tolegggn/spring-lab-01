<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swagger UI - Book API Demo</title>
  <link rel="stylesheet" type="text/css" href="/swagger-ui/swagger-ui.css" />
  <link rel="stylesheet" type="text/css" href="/swagger-ui/index.css" />
  <style>
    body { margin: 0; background-color: #fafafa; font-family: sans-serif; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/v3/api-docs",
        dom_id: '#swagger-ui',
        deepLinking: true,
        docExpansion: 'full',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        onComplete: function() {
          setTimeout(function() {
            var getOp = document.querySelector('.opblock-get');
            if (getOp) {
              var tryBtn = getOp.querySelector('.try-out__btn');
              if (tryBtn) tryBtn.click();
              setTimeout(function() {
                var execBtn = getOp.querySelector('.execute');
                if (execBtn) execBtn.click();
              }, 400);
            }
          }, 800);
        }
      });
    };
  </script>
</body>
</html>
