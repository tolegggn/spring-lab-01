<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <h1 th:text="${title}">Catalogue</h1>

    <div style="margin-bottom: 1rem;">
        <a th:href="@{/books/new}" class="button-link" style="display: inline-block; padding: 8px 16px; background-color: #22c55e; color: white; text-decoration: none; border-radius: 4px; font-weight: 500;">+ New Book (Form)</a>
    </div>

    <p th:if="${message}" class="flash" th:text="${message}"></p>

    <!-- Filter Form -->
    <form method="get" action="/books" class="filter-form">
        <label for="author">Filter by author:</label>
        <input type="text" id="author" name="author" th:value="${author}" placeholder="e.g. Bloch">
        <button type="submit">Filter</button>
        <a th:if="${author}" th:href="@{/books}" class="reset-link">Reset</a>
    </form>

    <table>
        <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th></tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.year}">2020</td>
        </tr>
    </table>

    <h2>Add a New Book</h2>
    <form method="post" action="/books" class="add-form">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div>
            <label for="author-input">Author:</label>
            <input type="text" id="author-input" name="author" required>
        </div>
        <div>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required>
        </div>
        <button type="submit">Add Book</button>
    </form>
</body>
</html>
